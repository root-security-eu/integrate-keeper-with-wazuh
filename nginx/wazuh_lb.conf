stream {
   upstream master {
       server 10.x.x.x:1515;
   }
   upstream wzmcluster {
       hash $remote_addr consistent;

       server 10.x.x.x:1514 max_fails=3 fail_timeout=10s;
       server 10.x.x.x:1514 max_fails=3 fail_timeout=10s;
   }
   upstream wzmsyslog{
       hash $remote_addr consistent;

       server 10.x.x.x:514;
       server 10.x.x.x:514;
   }
   server {
       listen 1515;
       proxy_pass master;
   }
   server {
       listen 1514;
       proxy_pass wzmcluster;
   }
   server {
       listen 514;
       proxy_pass wzmsyslog;
   }
   server {
       listen 514 udp;
       proxy_pass wzmsyslog;
   }
}